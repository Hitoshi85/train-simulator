<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aozora Line – Train Driver</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<main>
  <canvas id="game" width="960" height="600" aria-label="Train driving game"></canvas>
  <div id="touch">
    <button data-act="brake">▼ Brake</button>
    <button data-act="neutral">N</button>
    <button data-act="power">▲ Power</button>
    <button data-act="eb" class="eb">EB</button>
    <button data-act="enter">Start / OK</button>
    <button data-act="mute" id="mute">🔊 Sound on</button>
  </div>
  <p class="help">
    <b>↑ / W</b> power up &nbsp; <b>↓ / S</b> brake more &nbsp; <b>N</b> neutral &nbsp;
    <b>Space</b> emergency brake &nbsp; <b>Enter</b> start / continue &nbsp; <b>M</b> sound on / off
  </p>
</main>
<script src="game.js?v=4"></script>
</body>
</html>
