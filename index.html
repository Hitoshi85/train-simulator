<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aozora Line – Train Driver</title>
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>
<main>
  <canvas id="game" width="960" height="600" aria-label="Train driving game"></canvas>
  <div id="touch">
    <button data-act="brake">▼ Brake</button>
    <button data-act="neutral">N</button>
    <button data-act="power">▲ Power</button>
    <button data-act="eb" class="eb">EB</button>
    <button data-act="enter">Start / OK</button>
    <button data-act="pause" id="pause" class="util">⏸ Pause</button>
    <button data-act="mute" id="mute" class="util">🔊 Sound on</button>
    <button data-act="feedback" id="feedback" class="util" title="Send feedback (F)">💬 Feedback</button>
  </div>
  <p class="help">
    <b>↑ / W</b> power up &nbsp; <b>↓ / S</b> brake more &nbsp; <b>N</b> neutral &nbsp;
    <b>Space</b> emergency brake &nbsp; <b>Enter</b> start / continue &nbsp; <b>L / E</b> Local / Express (title) &nbsp; <b>P / Esc</b> pause &nbsp; <b>M</b> sound on / off &nbsp; <b>F</b> send feedback
  </p>
</main>
<script type="module" src="game.js?v=16"></script>
</body>
</html>
