name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Lint workflows and deploy scripts (actionlint, shellcheck)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
          shellcheck .github/scripts/*.sh
      - run: npm ci
      - run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke, phone screenshot, frame-budget and AI playtest tests
        run: npm test
      - name: Upload phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: phone-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload AI playtest balance table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance
          path: balance-report/
          if-no-files-found: ignore
          retention-days: 14
      # The same phone screenshots taken on main, so the reviewer can compare before and after.
      - name: Phone screenshots of main, for comparison
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git worktree add main-src FETCH_HEAD
          cd main-src && npm ci && npx playwright test tests/phone-checks.spec.js --grep screenshots
      - name: Upload main's phone screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots-main
          path: main-src/phone-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
