name: Daily backlog run

# Once a day (12:30 UTC: 07:30 New York time in winter, 08:30 in summer), after the scheduled Claude
# reviewer run at 07:00 New York time has marked big tasks `needs-yes`:
#   - promotes `proposed` tasks to `ready` after a 36-hour veto window (max 3 a day; `hold`,
#     `needs-yes` or a "no"/"drop" comment from the owner stops it)
#   - on Fridays, opens the weekly report issue (label `report`)
# The rules live in .github/scripts/daily.js (tested in tests/daily.spec.js). See docs/WORKFLOW.md.
on:
  schedule:
    - cron: '30 12 * * *' # GitHub cron is UTC only
  workflow_dispatch:
    inputs:
      report:
        description: Also write the weekly report now, even if it is not Friday
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: daily-backlog
  cancel-in-progress: false

jobs:
  daily:
    name: Daily backlog run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always the script from main, never from a PR branch.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const daily = require('./.github/scripts/daily.js');
            await daily.run({ github, context, core, forceReport: context.payload.inputs?.report === 'true' || context.payload.inputs?.report === true });
