name: Merge queue

# Merges PRs on their own, one at a time and oldest first, once they are green on top of main.
# A PR qualifies when it is small (800 changed lines or fewer, lock files and images not counted)
# and has a screenshot in its description (see .github/scripts/merge-queue.js),
# does not change workflow files, and has no `hold` label. Others wait for the owner.
# The script rebases the PR at the head of the queue onto main, re-runs CI, merges, deploys,
# then moves on to the next PR. One-time setup: see docs/WORKFLOW.md.
on:
  pull_request_target:
    types: [opened, reopened, edited, labeled, unlabeled, ready_for_review, synchronize]
  workflow_run:
    workflows: [CI, Claude review]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *' # fallback in case an event is missed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write

concurrency:
  group: merge-queue
  cancel-in-progress: false

jobs:
  queue:
    name: Merge queue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always the script from main, never from a PR branch.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const queue = require('./.github/scripts/merge-queue.js');
            await queue.run({ github, context, core });
