name: Task
description: A small, self-contained change Claude can pick up and ship as one PR.
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change for the player, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checks that prove it works. Prefer ones the smoke test can automate.
      value: |
        - [ ] 
        - [ ] `npm run check` passes and CI is green
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Hints, constraints, or out of scope.
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: ["S (under an hour)", "M (a few hours)", "L (split it up)"]
